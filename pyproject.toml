[project]
name = "fl-ai-producer"
version = "0.1.0"
description = "AI music-production pipeline for FL Studio driven by Claude Code"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "librosa>=0.10",
    "soundfile",
    "pyloudnorm",
    "pretty_midi",
    "mido",
    "yt-dlp",
    "typer",
    "rich",
]

[project.optional-dependencies]
ml = [
    "torch",
    "torchaudio",
    "demucs",
    "basic-pitch",
    "onnxruntime",
]
flp = [
    "flpkit",
]

[project.scripts]
analyze = "analyzer.cli:app"

# basic-pitch pulls TensorFlow on Windows, which has no clean wheels here; it
# falls back to its bundled ONNX model when TF is absent and onnxruntime is present.
[tool.uv]
override-dependencies = [
    "tensorflow; sys_platform == 'never'",
    "tensorflow-io-gcs-filesystem; sys_platform == 'never'",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyzer", "composer", "bridge", "compare"]
