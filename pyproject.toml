[project]
name = "fl-ai-producer"
version = "0.1.0"
description = "AI music-production pipeline for FL Studio driven by Claude Code"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "librosa>=0.10",
    "soundfile",
    "pyloudnorm",
    "pretty_midi",
    "mido",
    "yt-dlp",
    "typer",
    "rich",
]

[project.optional-dependencies]
ml = [
    "torch",
    "torchaudio",
    "demucs",
    "basic-pitch",
]
flp = [
    "flpkit",
]

[project.scripts]
analyze = "analyzer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analyzer", "composer", "bridge", "compare"]
